# /etc/nginx/sites-available/<HOST>  (symlinked from sites-enabled)
map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
    server_name <HOST>;

    # public chart images for the morning Telegram report (sendPhoto fetches by URL)
    location /charts/ {
        alias /var/www/charts/;
        add_header Cache-Control "no-store";
    }
    location / {
        proxy_pass http://127.0.0.1:7840;      # Vellum gateway
        proxy_buffering off;                    # streamed replies (SSE) must not be buffered,
        proxy_cache off;                        # otherwise clients lag until chat is re-opened
        chunked_transfer_encoding on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s; proxy_send_timeout 3600s;
        client_max_body_size 200m;
    }
    # listen 443 ssl + certificate lines are added by `certbot --nginx -d <HOST>`
}
